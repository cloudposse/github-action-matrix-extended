name: 'Matrix extended'
description: Overcome limitations of GitHub Action\u0027s matrixes using a workaround with reusable workflows and nested matrices
author: hello@cloudposse.com
branding:
  icon: 'wind'
  color: 'white'
inputs:
  matrix:
    required: true
    description: 'Matrix inputs (JSON array or object which includes property passed as string or file path)'
  sort-by:
    required: false
    description: 'Sort by query'
    default: 'empty'
  group-by:
    required: false
    description: 'Group by query'
    default: 'empty'
  nested-matrices-count:
    required: false
    description: 'Number of nested matrices that should be returned as the output (from 1 to 3)'
    default: "1"
outputs:
  matrix:
    description: A matrix suitable for extending matrix size workaround (see README)
    value: ${{ steps.matrix.outputs.output }}
runs:
  using: "composite"
  steps:
    - id: prepare-matrix
      shell: bash
      env:
        RUNNER_TEMP: ${{ runner.temp }}
      run: |
        set -euo pipefail

        # `matrix` can be a very large JSON blob. GitHub Actions passes `with:`
        # inputs to `uses:` steps as OS environment variables, and Linux caps a
        # single env/argv string at 128 KiB (MAX_ARG_STRLEN), so a large inline
        # value makes the runner fail to even start the jq action's node
        # process ("Argument list too long"). Materializing it to a file here
        # avoids that: the substitution below happens directly in this script
        # file (no OS env/argv size limit), and only a short file path is
        # forwarded to the jq step.
        matrix_file="${RUNNER_TEMP}/matrix-extended-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$$.json"
        cat > "$matrix_file" <<'MATRIX_EXTENDED_INPUT_EOF'
        ${{ inputs.matrix }}
        MATRIX_EXTENDED_INPUT_EOF

        # `matrix` may already be a file path rather than inline JSON (per the
        # action's input description); pass it through unchanged in that case.
        content="$(cat "$matrix_file")"
        if [[ -f "$content" ]]; then
          rm -f "$matrix_file"
          echo "file=$content" >> "$GITHUB_OUTPUT"
          echo "generated=false" >> "$GITHUB_OUTPUT"
        else
          echo "file=$matrix_file" >> "$GITHUB_OUTPUT"
          echo "generated=true" >> "$GITHUB_OUTPUT"
        fi
    - id: matrix
      uses: cloudposse/github-action-jq@v0
      with:
        compact: true
        input: ${{ steps.prepare-matrix.outputs.file }}
        script: |
          def name: ${{ inputs.sort-by }};
          def group: ${{ inputs.group-by }};
          
          def nestedMatricesLevelsAre(v): ${{ inputs.nested-matrices-count }} == v; 
          
          def chunk: .key / 256 | floor;
          def groupName: [(.value | group), (chunk | if . == 0 then empty else . end)] | join(" ");
          def groupRange: [first, last] | map(.value | name) | join(" - ");
          
          def toGHAMatrix: {"include": . } ;
          
          def oneLevelMatrix: . ;
          
          def twoLevelMatrix: 
              group_by(group) |
              map( to_entries | group_by(chunk) | 
                  map({
                      "name": first | groupName,
                      "items": map(.value) | toGHAMatrix | tostring
                  })
              ) | flatten;
          
          def threeLevelMatrix:
              group_by(group) |
              map({
                "name": first | group,
                "items": ( to_entries | group_by(chunk) | 
                  map({
                    "name": groupRange,
                    "items": map(.value) | toGHAMatrix | tostring
                  }) | toGHAMatrix | tostring
                )
              });
          
          def groupingStrategy:
              if nestedMatricesLevelsAre(3) then 
                  threeLevelMatrix
              elif nestedMatricesLevelsAre(2)  then 
                  twoLevelMatrix 
              else 
                  oneLevelMatrix 
              end; 

          def parseInput:
              if type == "array" then . else .include end;

          parseInput | sort_by(name) | groupingStrategy | toGHAMatrix
    - id: cleanup-matrix
      if: always() && steps.prepare-matrix.outputs.generated == 'true'
      shell: bash
      run: rm -f "${{ steps.prepare-matrix.outputs.file }}"
